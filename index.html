<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Memories ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="pop"><span class="grad">Our Memories</span> ✨</h1>
  <p class="sub pop d1">Little pictures and words worth keeping.</p>
  <div class="tabs pop d2">
    <button class="tab active" data-t="memory">📸 Memories</button>
    <button class="tab" data-t="quote">💬 Quotes</button>
    <button class="tab" data-t="poty">🏆 Photo of the Year</button>
  </div>
</header>
<main>
  <div class="bar"><button class="btn" id="add">Add a memory</button></div>
  <div id="list"></div>
</main>
<footer>Everything is reviewed before it appears 💙</footer>

<div class="modal" id="modal"><form class="sheet" id="form">
  <h2 id="mtitle">Share a memory</h2>
  <label>Your name</label><input id="name" maxlength="30" required placeholder="e.g. Sara">
  <div id="imgBox"><label>Picture</label><input id="file" type="file" accept="image/*"><img class="preview" id="prev" alt=""></div>
  <div id="qBox" hidden><label>Quote</label><textarea id="text" maxlength="300" placeholder="Something worth remembering…"></textarea></div>
  <div class="row"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn" id="send">Send</button></div>
</form></div>

<script>if(location.protocol==='file:')addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.style.cssText='background:#ff5d73;color:#fff;padding:12px;text-align:center;font:600 14px sans-serif';d.textContent='Do not double-click this file. Run "python -m http.server" in this folder and open http://localhost:8000 (or use GitHub Pages).';document.body.prepend(d)})</script>
<script type="module" src="app.js"></script>
</body>
</html>
